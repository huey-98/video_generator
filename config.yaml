# -*- coding: utf-8 -*-
# ============================================================
# AI 视频生成器配置
# 官方文档：
#   万相2.7 文生视频 https://help.aliyun.com/zh/model-studio/developer-reference/text-to-video
#   万相2.7 参考生视频 https://help.aliyun.com/zh/model-studio/wan-video-to-video-api-reference
#   价格 https://help.aliyun.cn/zh/model-studio/billing
# ============================================================

api:
  # 北京地域经典域名；若业务空间配置了专属域名，可在 .env 中用 DASHSCOPE_BASE_URL 覆盖
  base_url: "https://dashscope.aliyuncs.com/api/v1"
  poll_interval: 5      # 任务状态轮询间隔（秒）
  task_timeout: 3600    # 单个任务最长等待时间（秒）
                        # 超时≠失败：任务可能仍在平台执行，界面会自动把 task_id 填进「任务续查」
                        # 实测参考生视频(wan2.7-r2v)明显更慢：5 秒 720P 曾耗时近 29 分钟
  download_timeout: 300 # 视频下载超时（秒）
  upload_timeout: 300   # 参考素材上传到百炼临时空间的超时（秒）

output_dir: "outputs"   # 视频与元数据保存目录

defaults:
  model: "wan2.7-t2v-2026-06-12"   # Web UI 启动时默认选中的模型
  prompt_extend: true              # 智能改写提示词，默认开启
  watermark: false                 # 水印，默认关闭

# ------------------------------------------------------------
# 模型注册表
# 字段说明：
#   id            百炼平台模型ID
#   name          界面显示名
#   description   界面描述
#   duration      支持的时长范围（秒）
#   size_param    分辨率参数名（wan2.7-t2v 用 size，其余多用 resolution）
#   size_options  分辨率选项 [显示名, 传给API的值]
#   refs          参考素材配置（参考图 + 参考视频）：
#                 enabled    是否支持参考素材
#                 param      API 字段名（实测为 media）
#                 min_total  至少要几个素材；0 = 可有可无
#                 max_total  media 数组总长度上限；0 = 不限（只按下面分类上限约束）
#                 image/video  两类素材各自的配置：
#                     enabled     该类是否可用
#                     max         该类最多几个
#                     item_type   media 元素的 type 取值（实测只有三个合法值：
#                                 reference_image / reference_video / first_frame）
#                     upload_mode 本地文件如何变成平台能用的地址：
#                                 base64 = 直接内联 data:...;base64,...（体积放大 1/3）
#                                 oss    = 先上传到百炼临时空间换成 oss:// 临时URL
#                                          （免费、48 小时有效；平台不收 base64 时用）
#                 ※ 素材体积上限（平台）：参考图 ≤20MB、参考视频 ≤100MB、上传接口 ≤1GB
#                 ※ 素材规格：参考图 ≥240×240；参考视频 mp4/mov、1~30 秒
#   extra_params  该模型支持的额外参数（negative_prompt / seed / prompt_extend / watermark）
#   price_per_second  每秒单价（元），填数字后界面会显示费用预估；null 表示不显示
#
# ※ 以上 refs 取值均为 2026-09-24 直接探测平台校验报错得出，实测结论见 README。
#   若平台调整，改这里即可，无需改代码。
# ------------------------------------------------------------
models:
  - id: "wan2.7-t2v-2026-06-12"
    name: "万相2.7 文生视频"
    description: "纯文本生成视频：输入一段画面描述即可生成，适合从零创作。"
    duration: { min: 2, max: 15, default: 5 }
    size_param: "size"
    size_options:
      - ["720P (1280*720)", "1280*720"]
      - ["1080P (1920*1080)", "1920*1080"]
    refs: { enabled: false }   # 实测：t2v 不接受 media 字段（会被忽略）
    extra_params: ["negative_prompt", "seed", "prompt_extend", "watermark"]
    price_per_second: null

  - id: "wan2.7-r2v-2026-06-12"
    name: "万相2.7 参考生视频"
    description: "上传主体参考图（人物/角色/产品）或参考视频，生成时锁定主体外观与动作特征。"
    duration: { min: 2, max: 15, default: 5 }
    size_param: "resolution"
    size_options:
      - ["720P", "720P"]
      - ["1080P", "1080P"]
    refs:
      enabled: true
      param: "media"
      min_total: 1     # 实测：至少要有 1 个素材（只给视频也行——单独 reference_video 能通过校验）
      max_total: 5     # 实测：media 数组最多 5 项（图 + 视频合计，超了报 "Media array is too long"）
      image: { enabled: true, max: 5, item_type: "reference_image", upload_mode: "base64" }
      video: { enabled: true, max: 5, item_type: "reference_video", upload_mode: "base64" }
    extra_params: ["prompt_extend", "watermark"]
    price_per_second: null

  - id: "wan3.0-video"
    name: "万相3.0 视频（标准版）"
    description: "新一代全能模型：文生/参考生视频，最长 30 秒，30fps，原生音画同步。"
    duration: { min: 2, max: 30, default: 5 }
    size_param: "resolution"
    size_options:
      - ["480P", "480P"]
      - ["720P", "720P"]
      - ["1080P", "1080P"]
    refs:
      enabled: true
      param: "media"
      min_total: 0
      max_total: 15    # 实测：两类分别计数（10 图 + 5 视频），故总上限取两者之和
      image: { enabled: true, max: 10, item_type: "reference_image", upload_mode: "oss" }
      video: { enabled: true, max: 5, item_type: "reference_video", upload_mode: "oss" }
    extra_params: ["prompt_extend", "watermark"]
    price_per_second: null

  - id: "wan3.0-video-prime"
    name: "万相3.0 视频（Prime 高速版）"
    description: "万相3.0 高速版：能力与标准版对齐，生成速度更快，单价更高。"
    duration: { min: 2, max: 30, default: 5 }
    size_param: "resolution"
    size_options:
      - ["480P", "480P"]
      - ["720P", "720P"]
      - ["1080P", "1080P"]
    refs:
      enabled: true
      param: "media"
      min_total: 0
      max_total: 15
      image: { enabled: true, max: 10, item_type: "reference_image", upload_mode: "oss" }
      video: { enabled: true, max: 5, item_type: "reference_video", upload_mode: "oss" }
    extra_params: ["prompt_extend", "watermark"]
    price_per_second: null